<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - OpalShot</title>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .wrapper {
            width: 100%;
            background-color: #0a0a0a;
            padding: 40px 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #111111;
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            padding: 40px;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        .logo-text {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .logo-accent {
            color: #C3941A;
        }
        .content {
            padding: 40px;
            text-align: center;
        }
        .title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .description {
            font-size: 16px;
            color: #d0d0d0;
            margin-bottom: 30px;
        }
        .btn-wrapper {
            margin-bottom: 30px;
        }
        .reset-btn {
            background-color: #C3941A;
            color: #000000 !important;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
        }
        .info-box {
            background-color: #1a1a1a;
            border-left: 4px solid #C3941A;
            padding: 15px;
            font-size: 14px;
            color: #d0d0d0;
            text-align: right;
            margin-top: 20px;
        }
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            background-color: #050505;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <div class="logo-text">
                    <span class="logo-accent">Opal</span>Shot
                </div>
            </div>
            <div class="content">
                <h1 class="title">
                    إعادة تعيين كلمة المرور
                </h1>
                <p class="description">
                    لقد تلقينا طلباً لإعادة تعيين كلمة المرور الخاصة بحسابك. انقر على الزر أدناه لاختيار كلمة مرور جديدة وآمنة.
                </p>
                <div class="btn-wrapper">
                    <a href="#" class="reset-btn">
                        إعادة التعيين
                    </a>
                </div>
                <div class="info-box">
                    🔐 إذا لم تقم بطلب هذا، تجاهل الرسالة. الرابط صالح لمدة ساعة واحدة فقط ولا يمكن إعادة استخدامه.
                </div>
            </div>
            <div class="footer">
                &copy; 2026 OpalShot جميع الحقوق محفوظة
            </div>
        </div>
    </div>
</body>
</html>
