services:
    # 1. تطبيق لارافل (المحرك الأساسي HTTP / API)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: opticvault_app:prod
        restart: unless-stopped
        ports:
            - '127.0.0.1:${APP_PORT:-80}:80'
        environment:
            APP_ENV: production
        env_file:
            - .env
        volumes:
            - './storage:/var/www/html/storage' # حفظ ملفات الرفع لتبقى حتى لو توقف الكونتينر
            - './.env:/var/www/html/.env:ro'    # ربط ملف البيئة مباشرة داخل الحاوية
        networks:
            - opticvault_network
            - opticvault_default

        depends_on:
            redis:
                condition: service_healthy

    # 1.B. خادم WebSockets (Laravel Reverb)
    reverb:
        image: opticvault_app:prod
        restart: unless-stopped
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        env_file:
            - .env
        ports:
            - '8080:8080'
        volumes:
            - './storage:/var/www/html/storage'
            - './.env:/var/www/html/.env:ro'
        networks:
            - opticvault_network
            - opticvault_default

        depends_on:
            redis:
                condition: service_healthy

    # 2. محرك الكاش Redis (مهم للتوصيات والـ Reverb والطوابير)
    redis:
        image: 'redis:alpine'
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - opticvault_network
            - opticvault_default

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

    # 3. معالج المهام الخلفية (Queue Worker - لرفع الصور وتحليل AI)
    php-worker:
        image: opticvault_app:prod
        restart: unless-stopped
        command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=3", "--tries=3", "--timeout=300"]
        env_file:
            - .env
        volumes:
            - './storage:/var/www/html/storage'
            - './.env:/var/www/html/.env:ro'
        networks:
            - opticvault_network
            - opticvault_default

        depends_on:
            redis:
                condition: service_healthy

    # 4. المجدول (Task Scheduler)
    php-scheduler:
        image: opticvault_app:prod
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - .env
        volumes:
            - './storage:/var/www/html/storage'
            - './.env:/var/www/html/.env:ro'
        networks:
            - opticvault_network
            - opticvault_default

        depends_on:
            redis:
                condition: service_healthy

networks:
    opticvault_network:
        driver: bridge
    opticvault_default:
        name: opticvault_default

volumes:
    redis-data:
        driver: local
