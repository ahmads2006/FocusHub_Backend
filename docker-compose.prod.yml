services:
    # 1. تطبيق لارافل (المحرك الأساسي HTTP / API)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: opticvault:prod
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            APP_ENV: production
        volumes:
            - './storage:/var/www/html/storage' # حفظ ملفات الرفع لتبقى حتى لو توقف الكونتينر
        networks:
            - opticvault_network
        depends_on:
            redis:
                condition: service_healthy

    # 1.B. خادم WebSockets (Laravel Reverb)
    reverb:
        image: opticvault:prod
        restart: unless-stopped
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        ports:
            - '8080:8080'
        volumes:
            - './storage:/var/www/html/storage'
        networks:
            - opticvault_network
        depends_on:
            redis:
                condition: service_healthy

    # 2. محرك الكاش Redis (مهم للتوصيات والـ Reverb والطوابير)
    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - opticvault_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

    # 3. معالج المهام الخلفية (Queue Worker - لرفع الصور وتحليل AI)
    php-worker:
        image: opticvault:prod
        restart: unless-stopped
        command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=3", "--tries=3"]
        volumes:
            - './storage:/var/www/html/storage'
        networks:
            - opticvault_network
        depends_on:
            redis:
                condition: service_healthy

    # 4. المجدول (Task Scheduler)
    php-scheduler:
        image: opticvault:prod
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        volumes:
            - './storage:/var/www/html/storage'
        networks:
            - opticvault_network
        depends_on:
            redis:
                condition: service_healthy

networks:
    opticvault_network:
        driver: bridge

volumes:
    redis-data:
        driver: local
