services:
    # 1. تطبيق لارافل (المحرك الأساسي)
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:5173'
            - '8080:8080' # منفذ Laravel Reverb للـ WebSockets
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - opticvault_network
        depends_on:
            - mysql
            - redis
            # - localstack

    # 2. قاعدة البيانات MySQL 8.4
    mysql:
        image: 'mysql:8.4'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            # - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - opticvault_network
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    # 3. محرك الكاش Redis (مهم للتوصيات والـ Reverb)
    redis:
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - opticvault_network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    # 4. محاكي السحابة LocalStack Pro (لـ S3 و SQS)
    # localstack:
    #     container_name: opticvault_localstack
    #     image: 'localstack/localstack-pro:latest'
    #     ports:
    #         - '127.0.0.1:4566:4566' # منفذ خدمات AWS الموحد
    #         - '127.0.0.1:4510-4559:4510-4559' # منافذ الخدمات الإضافية
    #     environment:
    #         - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN} # مسحوب من .env
    #         - SERVICES=s3,sqs
    #         - DEBUG=1
    #         - DATA_DIR=/var/lib/localstack
    #     volumes:
    #         - 'sail-localstack:/var/lib/localstack'
    #         - '/var/run/docker.sock:/var/run/docker.sock'
    #     networks:
    #         - opticvault_network

    # 5. اختبار الإيميلات Mailpit
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - opticvault_network

    # 6. معالج المهام الخلفية (Queue Worker)
    # [PROFESSIONAL SETUP] Handles Image AI analysis and S3 uploads asynchronously.
    php-worker:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        # Use entrypoint to override the base start-container script
        entrypoint: [ "php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=3", "--tries=3" ]
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        networks:
            # - opalshot_network
            - opticvault_network
        depends_on:
            - redis
            - mysql
            # - localstack

    # 7. المجدول (Task Scheduler)
    # [PROFESSIONAL SETUP] Handles periodic cleanup, notifications, and auto-closing chats.
    php-scheduler:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        # Use entrypoint to override the base start-container script
        entrypoint: [ "php", "artisan", "schedule:work" ]
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        networks:
            - opticvault_network
            # - opalshot_network
        depends_on:
            - redis
            - mysql

networks:
    opticvault_network:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    # sail-localstack:
    #     driver: local
